[package]
name = "dictation-overlay"
version = "0.3.5"
edition = "2021"
description = "Native helper for dictation-beta — transparent OS-level caption overlay"
authors = ["bayashi"]
license = "MIT"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "dictation-overlay"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
