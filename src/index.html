<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dictation-overlay</title>
  <!-- v0.3.7: dictation-beta の captions.html と同じセットの Google Fonts を読み込む。
       fontFamily に 'Noto Sans JP' / 'Klee One' などを指定された時に正しく表示するため。
       オフライン環境ではフォールバックでシステム既定の sans-serif になる。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Noto+Serif+JP:wght@400;600;700&family=M+PLUS+1p:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Kosugi+Maru&family=Sawarabi+Gothic&family=Shippori+Mincho:wght@400;600;700&family=Klee+One:wght@400;600&family=Yomogi&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <!-- data-tauri-drag-region: Tauri 2.0 標準のドラッグ可能領域マーカー。
         クリックスルー OFF 時に字幕ボックスをつかんで窓ごと動かせる。
         (-webkit-app-region: drag は Tauri 2.x WebView2 だけだと効かないケースがあるため属性方式が確実) -->
    <div id="caption" class="caption" data-tauri-drag-region><p>dictation-overlay ready</p></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
